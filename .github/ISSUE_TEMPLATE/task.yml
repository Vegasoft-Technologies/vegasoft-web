name: Task
description: A change to make, with the conditions for calling it done.
labels: ["task"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to change, and why it is worth doing.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Conditions that can be checked, not intentions.
      placeholder: |
        - [ ] The footer lists the seven areas of work in catalogue order
        - [ ] Each area link scrolls to the matching section of the home page
        - [ ] The page has no horizontal scrolling at 375px
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Constraints, prior decisions, or anything that would trip someone up.
