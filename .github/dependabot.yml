# Dependabot opens one pull request a week for each of these, with the small updates
# grouped so that the week's routine bumps arrive together rather than one at a time.
# A major update is left alone: it comes as its own pull request, to be read properly.
#
# Nothing is proposed in its first week. A package that has just been published is the
# one most likely to have been taken over, and a week is long enough for that to surface
# before it reaches a pull request here.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # The types have to match the major version of the Node the site runs on, which
      # .nvmrc pins to 24. A newer major describes a runtime we do not use.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the Go rewrite. It waits until Next.js supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint 10 removes an API that eslint-config-next's bundled eslint-plugin-react
      # still calls, so linting crashes on it. It waits for that config to catch up.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
